# =====================================================================================
# Profil PRODUCTION (SPRING_PROFILES_ACTIVE=prod) - utilise par docker-compose.
# Toutes les valeurs sensibles viennent de variables d'environnement, sans valeur par defaut
# pour le secret JWT et le mot de passe de base : l'application refuse de demarrer s'ils manquent.
# [Benjamin - #05, 2026-10-15] Creation.
# =====================================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/educmanager}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:educmanager}
spring.datasource.password=${DB_PASSWORD}

# Hibernate met a jour le schema (tables creees au premier demarrage) ;
# le schema de reference est documente dans docs/conception/schema-postgresql.sql
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=false

app.jwt.secret=${JWT_SECRET}
app.seed.enabled=${APP_SEED_ENABLED:false}

springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Derriere le reverse proxy nginx : prise en compte de X-Forwarded-*
server.forward-headers-strategy=native
