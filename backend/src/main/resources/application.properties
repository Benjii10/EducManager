spring.application.name=educmanager-backend

# =====================================================================================
# Configuration commune + profil de DEVELOPPEMENT (par defaut) : base H2 en memoire.
# Le profil "prod" (application-prod.properties) bascule sur PostgreSQL.
# [Benjamin - #05, 2026-10-15] reorganisation, variables d'environnement, MongoDB.
# =====================================================================================

# --- Base relationnelle (dev : H2 en memoire, perdue a chaque redemarrage) ---
spring.datasource.url=jdbc:h2:mem:educmanager
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MongoDB (journal d'audit) ---
# serverSelectionTimeoutMS=2000 : si MongoDB est absent, on abandonne vite (l'audit est optionnel en dev)
# (Spring Boot 4 lit spring.mongodb.* ; spring.data.mongodb.* garde la compatibilite)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/educmanager?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/educmanager?serverSelectionTimeoutMS=2000&connectTimeoutMS=2000}
app.audit.enabled=${AUDIT_ENABLED:true}
# Duree de conservation des evenements (index TTL MongoDB) - RGPD
app.audit.retention-days=${AUDIT_RETENTION_DAYS:365}

# --- [Benjamin - #01, 2026-10-15] Securite JWT ---
# Secret de signature des tokens (>= 32 caracteres). En production : variable d'environnement JWT_SECRET.
app.jwt.secret=${JWT_SECRET:educmanager-dev-secret-change-me-in-production-0123456789}
# Duree de validite d'un token (24 h)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Anti force brute : blocage apres N echecs pendant X minutes
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.block-minutes=${LOGIN_BLOCK_MINUTES:15}
# Origines autorisees a appeler l'API depuis un navigateur (CORS)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Donnees de demonstration (comptes, filieres, cursus, cours, promotions) chargees si la base est vide
app.seed.enabled=${APP_SEED_ENABLED:true}

# --- Documentation de l'API (Swagger UI : /swagger-ui.html) ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

