# [Benjamin - #08, 2026-10-15] Deploiement complet : PostgreSQL + MongoDB + backend + frontend (nginx)
# Utilisation : copier .env.example en .env, renseigner les secrets, puis :  docker compose up -d --build
# Application : http://localhost:8081
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: educmanager
      POSTGRES_USER: ${DB_USER:-educmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-educmanager} -d educmanager"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-educmanager}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Definir MONGO_PASSWORD dans .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    image: ${IMAGE_PREFIX:-educmanager}/backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/educmanager
      DB_USER: ${DB_USER:-educmanager}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: mongodb://${MONGO_USER:-educmanager}:${MONGO_PASSWORD}@mongo:27017/educmanager?authSource=admin&serverSelectionTimeoutMS=5000
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET (32 caracteres minimum) dans .env}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
    # pas de port publie : le backend n'est joignable que via nginx (reseau interne Docker)

  frontend:
    build: ./frontend
    image: ${IMAGE_PREFIX:-educmanager}/frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:80"

volumes:
  postgres-data:
  mongo-data:
